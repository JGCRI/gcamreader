<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">gcamreader workflow</title>
  <desc id="desc">Workflow showing gcamreader connecting to local or remote GCAM databases, running XML queries through the bundled ModelInterface, and returning filtered pandas DataFrames for analysis.</desc>

  <defs>
    <!-- Brand palette -->
    <linearGradient id="gSource" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3a6fd8"/>
    </linearGradient>
    <linearGradient id="gConnect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#2a9387"/>
    </linearGradient>
    <linearGradient id="gQuery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a94b"/>
      <stop offset="1" stop-color="#e08a28"/>
    </linearGradient>
    <linearGradient id="gOutput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6cf0"/>
      <stop offset="1" stop-color="#7a47d8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <style>
    .stage-label { fill: #ffffff; font-weight: 700; font-size: 21px; }
    .stage-sub   { fill: #f3f5fa; font-weight: 500; font-size: 13.5px; }
    .heading     { fill: currentColor; font-weight: 700; font-size: 15px; letter-spacing: .06em; }
    .badge-txt   { fill: #1f2733; font-weight: 600; font-size: 13px; }
    .flow        { stroke: #9aa3b2; stroke-width: 2.5; fill: none; }
    .num         { fill: #ffffff; font-weight: 800; font-size: 15px; }
    .num-bg      { fill: rgba(255,255,255,0.22); }
  </style>

  <!-- ============ STAGE 1: SOURCES ============ -->
  <g transform="translate(40,150)">
    <rect width="230" height="220" rx="18" fill="url(#gSource)" filter="url(#shadow)"/>
    <circle class="num-bg" cx="32" cy="34" r="16"/>
    <text class="num" x="32" y="39" text-anchor="middle">1</text>
    <text class="stage-label" x="62" y="40">GCAM Output</text>
    <text class="stage-sub"   x="24" y="78">XML databases produced</text>
    <text class="stage-sub"   x="24" y="97">by GCAM model runs</text>

    <!-- local db -->
    <g transform="translate(24,118)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">📁 Local BaseX database</text>
    </g>
    <!-- remote db -->
    <g transform="translate(24,166)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">🌐 Remote BaseX server</text>
    </g>
  </g>

  <!-- ============ STAGE 2: CONNECT ============ -->
  <g transform="translate(330,150)">
    <rect width="230" height="220" rx="18" fill="url(#gConnect)" filter="url(#shadow)"/>
    <circle class="num-bg" cx="32" cy="34" r="16"/>
    <text class="num" x="32" y="39" text-anchor="middle">2</text>
    <text class="stage-label" x="62" y="40">Connect</text>
    <text class="stage-sub"   x="24" y="78">Open a connection to</text>
    <text class="stage-sub"   x="24" y="97">the target database</text>

    <g transform="translate(24,118)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">LocalDBConn()</text>
    </g>
    <g transform="translate(24,166)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">RemoteDBConn()</text>
    </g>
  </g>

  <!-- ============ STAGE 3: QUERY ============ -->
  <g transform="translate(620,150)">
    <rect width="230" height="220" rx="18" fill="url(#gQuery)" filter="url(#shadow)"/>
    <circle class="num-bg" cx="32" cy="34" r="16"/>
    <text class="num" x="32" y="39" text-anchor="middle">3</text>
    <text class="stage-label" x="62" y="40">Query</text>
    <text class="stage-sub"   x="24" y="78">Run XML queries via the</text>
    <text class="stage-sub"   x="24" y="97">bundled ModelInterface</text>

    <g transform="translate(24,118)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">parse_batch_query()</text>
    </g>
    <g transform="translate(24,166)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">runQuery() · importdata()</text>
    </g>
  </g>

  <!-- ============ STAGE 4: OUTPUT ============ -->
  <g transform="translate(910,150)">
    <rect width="230" height="220" rx="18" fill="url(#gOutput)" filter="url(#shadow)"/>
    <circle class="num-bg" cx="32" cy="34" r="16"/>
    <text class="num" x="32" y="39" text-anchor="middle">4</text>
    <text class="stage-label" x="62" y="40">Analyze</text>
    <text class="stage-sub"   x="24" y="78">Tidy pandas DataFrames,</text>
    <text class="stage-sub"   x="24" y="97">filtered &amp; ready to use</text>

    <g transform="translate(24,118)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">🐼 pandas.DataFrame</text>
    </g>
    <g transform="translate(24,166)">
      <rect width="182" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
      <text class="badge-txt" x="14" y="25">📊 plot · model · export</text>
    </g>
  </g>

  <!-- ============ FLOW ARROWS ============ -->
  <path class="flow" d="M272,260 H326" marker-end="url(#arrow)"/>
  <path class="flow" d="M562,260 H616" marker-end="url(#arrow)"/>
  <path class="flow" d="M852,260 H906" marker-end="url(#arrow)"/>

  <!-- ============ FILTER NOTE under stage 3 ============ -->
  <g transform="translate(620,392)">
    <rect width="230" height="58" rx="12" fill="none" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text class="heading" x="115" y="25" text-anchor="middle" fill="#e08a28">FILTER ON THE FLY</text>
    <text x="115" y="44" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="500">scenarios · regions</text>
  </g>
  <path class="flow" d="M735,392 V372" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- ============ TITLE ============ -->
  <text x="40" y="64" class="heading" fill="currentColor" font-size="13">gcamreader workflow</text>
  <text x="40" y="104" fill="currentColor" font-size="30" font-weight="800">From GCAM databases to pandas, in four steps</text>
</svg>
